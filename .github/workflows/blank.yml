name: Sync Code to GitLab

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-code-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure Git
        run: |
          git config user.name "GitHub-GitLab Sync Bot"
          git config user.email "github-gitlab-sync-bot@users.noreply.github.com"
      - name: Validate GitLab configuration
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO_URL: ${{ secrets.GITLAB_REPO_URL_THEMES }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "ERROR: GITLAB_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$GITLAB_REPO_URL" ]; then
            echo "ERROR: GITLAB_REPO_URL_THEMES is not configured."
            exit 1
          fi
          echo "GitLab repository URL is configured."
      - name: Add GitLab remote
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO_URL: ${{ secrets.GITLAB_REPO_URL_THEMES }}
        run: |
          GITLAB_HOST="${GITLAB_REPO_URL#https://}"
          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@${GITLAB_HOST}"
          echo "GitLab remote configured."
      - name: Synchronize branches
        run: |
          git push gitlab \
            'refs/heads/*:refs/heads/*'
      - name: Synchronize tags
        run: |
          git push gitlab \
